name: Test and Publish Spring Boot Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17 and restore Gradle cache
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle executable permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test bootJar --no-daemon

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: build/libs/app.jar
          if-no-files-found: error

  docker-build:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar
          path: build/libs

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/khanhan007/ss11-hw05-springboot:latest
            ghcr.io/khanhan007/ss11-hw05-springboot:${{ github.sha }}
